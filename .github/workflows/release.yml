name: Build and Release Packages

on:
  release:
    types: [published]
  # Manual re-run for an existing release, e.g. to backfill missing assets.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets for (e.g. v2.1.1)"
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Tauri Target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Tauri dependencies (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri Bundles
        run: |
          cd src-tauri
          cargo tauri build --bundles deb

      - name: List Linux Bundles
        run: find src-tauri/target/release/bundle -maxdepth 2 -type f

      - name: Upload Linux Assets
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Tauri Target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri Bundles
        run: |
          cd src-tauri
          cargo tauri build --bundles nsis

      - name: Create Portable EXE
        run: |
          $guiExe = Join-Path "src-tauri\target\release" "lockbook.exe"
          if (-not (Test-Path $guiExe)) {
            throw "Could not find lockbook.exe in src-tauri\target\release"
          }
          Copy-Item $guiExe "Lockbook-portable-${{ env.RELEASE_TAG }}.exe"

      - name: List Windows Bundles
        run: Get-ChildItem src-tauri\target\release\bundle -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            Lockbook-portable-${{ env.RELEASE_TAG }}.exe
            src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Tauri Target
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri Bundles
        run: |
          cd src-tauri
          cargo tauri build --bundles dmg

      - name: List macOS Bundles
        run: find src-tauri/target/release/bundle -maxdepth 2 -type f

      - name: Upload macOS Assets
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

  build-flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Lockbook-${{ env.RELEASE_TAG }}.flatpak
          manifest-path: flatpak/io.github.SnowTimSwiss.LockBook.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Asset
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          if-no-files-found: error
          path: |
            Lockbook-${{ env.RELEASE_TAG }}.flatpak

  # Upload everything from one job to the existing release. Having each build job
  # upload on its own let action-gh-release race and create a separate release,
  # so only the last job's files (Windows) ended up on the visible release.
  publish:
    needs: [build-linux, build-windows, build-macos, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Artifacts keep their directory layout (e.g. the NSIS installer lands in
      # assets/src-tauri/target/release/bundle/nsis/), so collect only the files.
      - name: List assets
        run: find assets -type f -exec ls -la {} +

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find assets -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.flatpak' \) | sort -u)
          printf '%s\n' "${files[@]}"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
